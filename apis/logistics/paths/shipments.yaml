get:
  operationId: listShipments
  summary: List shipments
  description: Returns the caller's shipments, newest first.
  tags:
    - Shipments
  security:
    - OAuth2:
        - shipments:read
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
    - name: status
      in: query
      required: false
      description: Only shipments in this state.
      schema:
        type: string
        enum:
          - created
          - in_transit
          - delivered
          - exception
  responses:
    '200':
      description: A page of shipments.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ShipmentList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml

post:
  operationId: createShipment
  summary: Create a shipment
  description: Books a shipment with the carrier and returns the tracking number.
  tags:
    - Shipments
  security:
    - OAuth2:
        - shipments:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ShipmentRequest.yaml
  responses:
    '201':
      description: The shipment was booked.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Shipment.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
