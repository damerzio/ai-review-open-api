get:
  operationId: getWebhookSubscription
  summary: Get the webhook subscription
  description: Returns the caller's webhook subscription.
  tags:
    - Webhooks
  security:
    - OAuth2:
        - shipments:read
  responses:
    '200':
      description: The subscription.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WebhookSubscription.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml

put:
  operationId: setWebhookSubscription
  summary: Create or replace the webhook subscription
  description: Sets the endpoint and event types for tracking event deliveries.
  tags:
    - Webhooks
  security:
    - OAuth2:
        - shipments:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/WebhookSubscription.yaml
  responses:
    '200':
      description: The subscription.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WebhookSubscription.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
