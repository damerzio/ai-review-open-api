parameters:
  - $ref: ../components/parameters/ShipmentId.yaml

get:
  operationId: listTrackingEvents
  summary: List tracking events
  description: Returns the carrier scan events for a shipment, oldest first.
  tags:
    - Tracking
  security:
    - OAuth2:
        - shipments:read
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    '200':
      description: A page of tracking events.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrackingEventList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
