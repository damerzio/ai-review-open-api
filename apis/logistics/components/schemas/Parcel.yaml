type: object
unevaluatedProperties: false
description: One parcel in a shipment.
properties:
  weightGrams:
    type: integer
    format: int32
    description: Weight in grams.
    minimum: 1
    maximum: 70000
  lengthCm:
    type: integer
    format: int32
    description: Length in centimetres.
    minimum: 1
    maximum: 300
  widthCm:
    type: integer
    format: int32
    description: Width in centimetres.
    minimum: 1
    maximum: 300
  heightCm:
    type: integer
    format: int32
    description: Height in centimetres.
    minimum: 1
    maximum: 300
  contents:
    type: string
    description: Customs description of the contents.
    maxLength: 200
required:
  - weightGrams
