type: object
unevaluatedProperties: false
description: One parcel in a shipment.
properties:
  weightGrams:
    type: integer
    format: int32
    description: Weight in grams, including packaging.
    minimum: 1
    maximum: 70000
  dimensions:
    $ref: ./Dimensions.yaml
  contents:
    type: string
    description: Customs description of the contents.
    maxLength: 200
  reference:
    type: string
    description: Customer reference printed on the label.
    maxLength: 40
required:
  - weightGrams
