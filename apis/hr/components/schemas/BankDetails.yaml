type: object
unevaluatedProperties: false
description: Account payroll is paid into.
properties:
  accountHolder:
    type: string
    description: Name on the account.
    maxLength: 140
  iban:
    type: string
    description: IBAN.
    maxLength: 34
    pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
  bic:
    type: string
    description: BIC of the bank.
    maxLength: 11
    pattern: '^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$'
  taxId:
    type: string
    description: National tax identifier.
    maxLength: 32
    pattern: '^[A-Z0-9-]+$'
required:
  - accountHolder
  - iban
