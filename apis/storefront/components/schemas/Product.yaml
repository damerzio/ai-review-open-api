type: object
additionalProperties: false
description: A single catalog entry as shown in the storefront.
allOf:
  - $ref: ../../../shared/components/schemas/Timestamps.yaml
  - type: object
    additionalProperties: false
    properties:
      id:
        type: string
        description: Identifier of the product.
        format: uuid
        maxLength: 36
        readOnly: true
      sku:
        type: string
        description: Stock keeping unit shared with the Inventory API.
        maxLength: 32
        pattern: '^[A-Z0-9-]{4,32}$'
      name:
        type: string
        description: Display name of the product.
        maxLength: 200
      description:
        type: string
        description: Long-form marketing copy rendered on the product page.
        maxLength: 4000
      category:
        type: string
        description: Slug of the category the product belongs to.
        maxLength: 64
        pattern: '^[a-z0-9-]+$'
      price:
        $ref: ../../../shared/components/schemas/Money.yaml
      published:
        type: boolean
        description: Whether the product is visible in the storefront.
      tags:
        type: array
        description: Free-form tags used for merchandising.
        maxItems: 20
        items:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9-]+$'
    required:
      - sku
      - name
      - price
