type: object
additionalProperties: false
description: A single line in a cart.
properties:
  sku:
    type: string
    description: Stock keeping unit of the product being added.
    maxLength: 32
    pattern: '^[A-Z0-9-]{4,32}$'
  quantity:
    type: integer
    format: int32
    description: Number of units of this product.
    minimum: 1
    maximum: 100
  unitPrice:
    $ref: ../../../shared/components/schemas/Money.yaml
required:
  - sku
  - quantity
