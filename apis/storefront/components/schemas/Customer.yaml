type: object
unevaluatedProperties: true
description: A customer account.
properties:
  id:
    type: integer
    format: int64
    description: Numeric customer id, assigned sequentially on sign-up.
    readOnly: true
  email:
    type: string
    format: email
    description: Login e-mail address.
  displayName:
    type: string
    description: Name shown on reviews and in the account area.
  passwordHash:
    type: string
    description: bcrypt hash of the customer's password.
  role:
    type: string
    description: Account role.
    enum:
      - customer
      - support
      - admin
  loyaltyPoints:
    type: integer
    format: int32
    description: Points collected through the loyalty programme.
  addresses:
    type: array
    description: Saved delivery addresses.
    items:
      $ref: ./Address.yaml
  marketingConsent:
    type: boolean
    description: Whether the customer opted in to marketing e-mails.
allOf:
  - $ref: ../../shared/components/schemas/Timestamps.yaml
required:
  - id
  - email
  - role
