post:
  operationId: createCart
  summary: Create a cart
  description: |
    Opens an empty cart for the authenticated customer. A customer may hold several carts
    at once, for example one per delivery country.
  tags:
    - Carts
  security:
    - OAuth2:
        - carts:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Cart.yaml
  responses:
    '201':
      description: The cart was created.
      headers:
        RateLimit-Limit:
          $ref: ../../shared/components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../../shared/components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../../shared/components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../../shared/components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Cart.yaml
    '400':
      $ref: ../../shared/components/responses/BadRequest.yaml
    '401':
      $ref: ../../shared/components/responses/Unauthorized.yaml
    '429':
      $ref: ../../shared/components/responses/TooManyRequests.yaml
    '500':
      $ref: ../../shared/components/responses/InternalServerError.yaml
