parameters:
  - name: customerId
    in: path
    required: true
    description: Numeric id of the customer.
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807

post:
  operationId: resetCustomerPassword
  summary: Reset the password
  description: |
    Sets a new password using the reset token from the e-mail link. The link is opened in
    a browser, so the token is accepted as a query parameter and no access token is required.
  tags:
    - Customers
  security: []
  parameters:
    - name: token
      in: query
      required: true
      description: Reset token from the e-mail link.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{32,128}$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            newPassword:
              type: string
              format: password
              description: The new password.
              minLength: 12
          required:
            - newPassword
  responses:
    '204':
      description: The password was changed.
      headers:
        RateLimit-Limit:
          $ref: ../../shared/components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../../shared/components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../../shared/components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../../shared/components/headers/AccessControlAllowOrigin.yaml
    '400':
      $ref: ../../shared/components/responses/BadRequest.yaml
    '401':
      $ref: ../../shared/components/responses/Unauthorized.yaml
    '429':
      $ref: ../../shared/components/responses/TooManyRequests.yaml
    '500':
      $ref: ../../shared/components/responses/InternalServerError.yaml
