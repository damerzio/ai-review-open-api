type: object
unevaluatedProperties: false
description: Monetary amount in minor units.
properties:
  amount:
    type: integer
    format: int64
    description: Amount in the currency's minor unit.
    minimum: -1000000000000
    maximum: 1000000000000
  currency:
    type: string
    description: ISO 4217 currency code.
    maxLength: 3
    pattern: '^[A-Z]{3}$'
required:
  - amount
  - currency
