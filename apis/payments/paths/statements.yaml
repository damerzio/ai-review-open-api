get:
  operationId: listStatements
  summary: List statements
  description: Returns statements for the caller's accounts, most recent period first.
  tags:
    - Statements
  security:
    - OAuth2:
        - statements:read
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
    - name: accountId
      in: query
      required: false
      description: Restrict the page to one account.
      schema:
        type: string
        pattern: '^acct_[0-9A-HJKMNP-TV-Z]{26}$'
        maxLength: 31
    - name: period
      in: query
      required: false
      description: Restrict the page to one calendar month, as YYYY-MM.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        maxLength: 7
  responses:
    '200':
      description: A page of statements.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StatementList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
