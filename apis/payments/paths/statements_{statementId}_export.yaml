get:
  operationId: exportStatement
  summary: Export a statement
  description: |
    Streams the statement's transactions as CSV. The file is generated in the request, so
    the client gets the finished export in the response rather than a job to poll.
  tags:
    - Statements
  security:
    - OAuth2:
        - statements:read
  parameters:
    - $ref: ../components/parameters/StatementId.yaml
    - name: limit
      in: query
      required: false
      description: Maximum number of rows to include in the export.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000000
        default: 5000000
    - name: columns
      in: query
      required: false
      description: Columns to include, in order. Defaults to every column.
      schema:
        type: array
        maxItems: 24
        items:
          type: string
          enum:
            - bookedAt
            - description
            - counterparty
            - amount
            - currency
            - runningBalance
  responses:
    '200':
      description: The statement as CSV.
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/RateLimitLimit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/RateLimitRemaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/RateLimitReset.yaml
        Access-Control-Allow-Origin:
          $ref: ../components/headers/AccessControlAllowOrigin.yaml
      content:
        text/csv:
          schema:
            type: string
            description: CSV document, one transaction per row, with a header row.
            format: binary
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
